<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Лунный атлас</title>
<meta id="m-desc" name="description" content="Интерактивная карта видимой стороны Луны: 60 объектов с названиями, размерами и фактами. Тень идёт по настоящей фазе — карта показывает, что доступно вашей оптике именно сегодня.">
<link rel="canonical" href="https://andrewivlev.github.io/">
<meta property="og:type" content="website">
<meta property="og:url" content="https://andrewivlev.github.io/">
<meta id="m-og-site" property="og:site_name" content="Лунный атлас">
<meta id="m-og-locale" property="og:locale" content="ru_RU">
<meta id="m-og-title" property="og:title" content="Лунный атлас">
<meta id="m-og-desc" property="og:description" content="60 объектов с названиями, размерами и фактами. Кратеры в истинном масштабе, тень идёт по настоящей фазе — видно, что доступно сегодня.">
<meta property="og:image" content="https://andrewivlev.github.io/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta id="m-og-alt" property="og:image:alt" content="Схема видимой стороны Луны с подписанными морями и кратерами">
<meta name="twitter:card" content="summary_large_image">
<meta id="m-tw-title" name="twitter:title" content="Лунный атлас">
<meta id="m-tw-desc" name="twitter:description" content="60 объектов с названиями, размерами и фактами. Тень идёт по настоящей фазе.">
<meta name="twitter:image" content="https://andrewivlev.github.io/og.png">
<meta name="theme-color" content="#0A0D12">
<link rel="alternate" hreflang="ru" href="https://andrewivlev.github.io/?lang=ru">
<link rel="alternate" hreflang="en" href="https://andrewivlev.github.io/?lang=en">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='13' fill='%23E4DCC9'/><path d='M6.5 6.5a13 13 0 0 0 0 19 15.5 15.5 0 0 1 0-19z' fill='%230A0D12'/></svg>">
<style>
  :root{
    --ink:#0A0D12;
    --ink-2:#111621;
    --ink-3:#181E2B;
    --bone:#E4DCC9;
    --bone-dim:#CBC1A9;
    --slate:#5A6479;
    --slate-dark:#414A5D;
    --brass:#A98A4B;
    --verdigris:#7FA79A;
    --amber:#DDA24A;
    --text:#C7C2B5;
    --muted:#78735F;
    --line:rgba(169,138,75,.22);
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(1200px 700px at 78% -8%, #17202F 0%, rgba(23,32,47,0) 60%),
      var(--ink);
    color:var(--text);
    font-family:var(--serif);
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:34px 20px 90px}

  /* ---------- masthead ---------- */
  .top{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin:0 0 14px}
  .eyebrow{
    font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--muted);margin:0;
  }
  .langs{display:flex;gap:1px;background:var(--line);border:1px solid var(--line);flex:none}
  .langs button{
    font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
    background:var(--ink-2);color:var(--muted);border:none;padding:6px 10px;cursor:pointer;
    transition:color .15s,background .15s}
  .langs button:hover{color:var(--bone-dim)}
  .langs button[aria-pressed=true]{color:var(--ink);background:var(--verdigris)}
  .langs button:focus-visible{outline:1px solid var(--verdigris);outline-offset:3px}
  h1{
    font-family:var(--serif);font-weight:400;font-size:clamp(30px,7vw,52px);
    line-height:1.05;letter-spacing:-.015em;color:var(--bone);margin:0 0 10px;
  }
  h1 em{font-style:italic;color:var(--amber)}
  .lede{max-width:56ch;font-size:15.5px;color:#A9A497;margin:0 0 26px}

  .readout{
    display:flex;flex-wrap:wrap;
    gap:1px;background:var(--line);border:1px solid var(--line);margin:0 0 30px;
  }
  .readout div{background:var(--ink-2);padding:11px 13px;flex:1 1 132px}
  .readout dt{font-family:var(--mono);font-size:10px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--muted);margin:0 0 4px}
  .readout dd{margin:0;font-family:var(--mono);font-size:15px;color:var(--bone)}
  .readout dd small{font-size:11px;color:var(--muted);letter-spacing:.04em}

  /* ---------- layout ---------- */
  .stage{display:grid;grid-template-columns:minmax(0,1.32fr) minmax(0,1fr);gap:26px;align-items:start}
  @media(max-width:860px){.stage{grid-template-columns:1fr}}

  .chart{position:relative}
  svg#moon{width:100%;height:auto;display:block;touch-action:manipulation}
  .hint{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--muted);margin:12px 0 0;text-align:center}

  /* ---------- controls ---------- */
  .controls{margin-top:18px;border:1px solid var(--line);background:var(--ink-2);padding:16px}
  .slider-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:6px}
  .slider-row label{font-family:var(--mono);font-size:10px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--muted)}
  .slider-row output{font-family:var(--mono);font-size:13px;color:var(--amber)}
  input[type=range]{
    -webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;margin:0;
  }
  input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--line)}
  input[type=range]::-moz-range-track{height:2px;background:var(--line)}
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:14px;height:14px;margin-top:-6px;border-radius:50%;
    background:var(--amber);border:none;cursor:pointer}
  input[type=range]::-moz-range-thumb{width:14px;height:14px;border:none;border-radius:50%;
    background:var(--amber);cursor:pointer}
  input[type=range]:focus-visible{outline:1px solid var(--verdigris);outline-offset:4px}

  .mag-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;
    padding-top:12px;border-top:1px solid var(--line)}
  .mag-row label{font-family:var(--mono);font-size:10px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--muted)}
  .mag-field{display:flex;align-items:baseline;gap:4px;font-family:var(--mono);
    font-size:13px;color:var(--amber)}
  .mag-field input{font-family:var(--mono);font-size:13px;color:var(--amber);
    background:var(--ink-3);border:1px solid var(--line);padding:5px 7px;width:66px;
    text-align:right;-moz-appearance:textfield}
  .mag-field input:focus-visible{outline:1px solid var(--verdigris);outline-offset:2px}
  .place-field{display:flex;align-items:center;gap:9px;font-family:var(--mono);
    font-size:12px;color:var(--bone-dim)}
  .place-field button{font-family:var(--mono);font-size:10px;letter-spacing:.1em;
    text-transform:uppercase;background:transparent;color:var(--muted);
    border:1px solid var(--line);padding:5px 9px;cursor:pointer;
    transition:color .15s,border-color .15s}
  .place-field button:hover{color:var(--bone-dim);border-color:rgba(169,138,75,.45)}
  .place-field button:focus-visible{outline:1px solid var(--verdigris);outline-offset:2px}

  .toggles{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
  .toggles button{
    font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
    background:transparent;color:var(--muted);border:1px solid var(--line);
    padding:7px 11px;cursor:pointer;transition:color .15s,border-color .15s,background .15s}
  .toggles button:hover{color:var(--bone-dim);border-color:rgba(169,138,75,.45)}
  .toggles button[aria-pressed=true]{color:var(--ink);background:var(--verdigris);border-color:var(--verdigris)}
  .toggles button:focus-visible{outline:1px solid var(--verdigris);outline-offset:3px}

  /* ---------- panel ---------- */
  .card{border:1px solid var(--line);background:var(--ink-2);padding:20px}
  .card .kicker{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--verdigris);margin:0 0 8px}
  .card h2{font-family:var(--serif);font-weight:400;font-style:italic;font-size:27px;
    color:var(--bone);margin:0 0 2px;line-height:1.1}
  .card .ru{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;color:var(--muted);
    margin:0 0 16px;text-transform:uppercase}
  .metrics{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);
    border:1px solid var(--line);margin:0 0 16px}
  .metrics div{background:var(--ink-3);padding:9px 11px}
  .metrics dt{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;
    color:var(--muted);margin:0 0 3px}
  .metrics dd{margin:0;font-family:var(--mono);font-size:14px;color:var(--bone)}
  .card p.fact{font-size:15px;color:#B4AFA1;margin:0}
  .card .verdict{font-family:var(--mono);font-size:11px;letter-spacing:.06em;margin:16px 0 0;
    padding-top:14px;border-top:1px solid var(--line);color:var(--bone-dim)}

  .tonight{margin-top:22px;border:1px solid var(--line);background:var(--ink-2);padding:20px}
  .tonight h3{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--amber);margin:0 0 4px;font-weight:400}
  .tonight p.sub{font-size:13.5px;color:var(--muted);margin:0 0 14px}
  .tonight ol{list-style:none;margin:0;padding:0;counter-reset:t}
  .tonight li{border-top:1px solid var(--line);padding:9px 0 8px;display:flex;gap:12px;align-items:baseline}
  .tonight li:first-child{border-top:none}
  .tonight li .nm{font-style:italic;font-size:16px;color:var(--bone);flex:1;cursor:pointer;
    background:none;border:none;padding:0;text-align:left;font-family:var(--serif)}
  .tonight li .nm:hover{color:var(--amber)}
  .tonight li .dim{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap}
  .tonight .empty{font-size:14px;color:var(--muted);margin:0}

  /* ---------- catalogue ---------- */
  .cat{margin-top:56px}
  .cat h2{font-family:var(--serif);font-weight:400;font-size:26px;color:var(--bone);
    margin:0 0 6px;letter-spacing:-.01em}
  .cat > p{max-width:60ch;font-size:14.5px;color:var(--muted);margin:0 0 26px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:1px;
    background:var(--line);border:1px solid var(--line)}
  .grid .col{background:var(--ink-2);padding:18px}
  .grid h3{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--verdigris);margin:0 0 12px;font-weight:400}
  .grid ul{list-style:none;margin:0;padding:0}
  .grid li{padding:5px 0}
  .grid button{background:none;border:none;padding:0;cursor:pointer;text-align:left;
    font-family:var(--serif);font-size:15.5px;color:var(--bone-dim);display:flex;
    justify-content:space-between;gap:10px;width:100%}
  .grid button:hover{color:var(--amber)}
  .grid button span.n{font-family:var(--mono);font-size:11px;color:var(--muted)}
  .grid button:focus-visible{outline:1px solid var(--verdigris);outline-offset:2px}

  footer{margin-top:56px;padding-top:20px;border-top:1px solid var(--line);
    font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--muted);
    display:flex;flex-wrap:wrap;gap:6px 22px}

  /* svg bits */
  .m-label{font-family:var(--serif);font-style:italic;fill:#0D1017;opacity:.66;
    text-anchor:middle;pointer-events:none;letter-spacing:.06em}
  .c-label{font-family:var(--mono);fill:#14181F;text-anchor:middle;pointer-events:none;
    letter-spacing:.02em;paint-order:stroke;stroke:rgba(236,229,212,.92);stroke-width:3.6px}
  .hit{pointer-events:all}
  .hit{cursor:pointer;fill:transparent}
  @media(prefers-reduced-motion:no-preference){
    .fade{transition:opacity .35s ease}
  }
  /* labels must survive being scaled down on a phone */
  @media(max-width:700px){
    .m-label{font-size:24px !important}
    .c-label{font-size:22px !important;stroke-width:5px}
  }
  @media(max-width:430px){
    .wrap{padding:24px 14px 70px}
    .card,.tonight,.controls,.grid .col{padding:15px}
  }
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="top">
    <p class="eyebrow" id="eyebrow"></p>
    <div class="langs" id="langs" role="group" aria-label="Language">
      <button type="button" data-lang="en" aria-pressed="false">Eng</button>
      <button type="button" data-lang="ru" aria-pressed="true">Рус</button>
    </div>
  </div>
  <h1 id="h1"></h1>
  <p class="lede" id="lede"></p>

  <dl class="readout">
    <div><dt id="k-phase"></dt><dd id="r-phase"></dd></div>
    <div><dt id="k-illum"></dt><dd id="r-illum"></dd></div>
    <div><dt id="k-term"></dt><dd id="r-term"></dd></div>
    <div><dt id="k-limit"></dt><dd id="r-limit"></dd></div>
    <div><dt id="k-alt"></dt><dd id="r-alt"></dd></div>
    <div><dt id="k-tilt"></dt><dd id="r-tilt"></dd></div>
    <div><dt id="k-scale"></dt><dd id="r-scale"></dd></div>
  </dl>
</header>

<div class="stage">
  <section class="chart">
    <svg id="moon" viewBox="0 0 1000 1000" role="img" aria-label="">
      <defs>
        <radialGradient id="gLimb" cx="50%" cy="50%" r="50%">
          <stop offset="72%" stop-color="#E4DCC9"/>
          <stop offset="100%" stop-color="#AFA48A"/>
        </radialGradient>
        <radialGradient id="gRay" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#FFFBF0" stop-opacity=".55"/>
          <stop offset="100%" stop-color="#FFFBF0" stop-opacity="0"/>
        </radialGradient>
        <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
        <clipPath id="limb"><circle cx="500" cy="500" r="460"/></clipPath>
      </defs>

      <circle cx="500" cy="500" r="472" fill="none" stroke="rgba(169,138,75,.16)"/>
      <g id="sky">
        <circle id="disk" cx="500" cy="500" r="460" fill="url(#gLimb)"/>
        <g id="gridL" opacity=".5"></g>
        <g id="maria" clip-path="url(#limb)"></g>
        <g id="rays" clip-path="url(#limb)"></g>
        <g id="ranges"></g>
        <g id="craters"></g>
        <g id="sites" style="display:none"></g>
        <g id="shadow"></g>
        <g id="termband"></g>
        <g id="labels"></g>
        <g id="hits"></g>
        <g id="frame"></g>
      </g>
      <g id="scale"></g>
    </svg>
    <p class="hint" id="hint"></p>

    <div class="controls">
      <div class="slider-row">
        <label for="age" id="k-age"></label>
        <output id="ageOut"></output>
      </div>
      <input id="age" type="range" min="0" max="29.53" step="0.05">
      <div class="mag-row">
        <label for="mag" id="k-mag"></label>
        <span class="mag-field"><input id="mag" type="number" min="2" max="400" step="1" value="10" inputmode="numeric"><span aria-hidden="true">×</span></span>
      </div>
      <div class="mag-row">
        <span id="k-place"></span>
        <span class="place-field"><span id="placeVal"></span><button type="button" id="geo"></button></span>
      </div>
      <div class="toggles">
        <button id="t-today" aria-pressed="true"></button>
        <button id="t-full" aria-pressed="false"></button>
        <button id="t-sky" aria-pressed="false"></button>
        <button id="t-names" aria-pressed="false"></button>
        <button id="t-bino" aria-pressed="false"></button>
        <button id="t-sites" aria-pressed="false"></button>
      </div>
    </div>
  </section>

  <aside>
    <article class="card" id="card">
      <p class="kicker" id="c-kind"></p>
      <h2 id="c-name"></h2>
      <p class="ru" id="c-ru"></p>
      <dl class="metrics">
        <div><dt id="k-dia"></dt><dd id="c-d"></dd></div>
        <div><dt id="k-dep"></dt><dd id="c-h"></dd></div>
        <div><dt id="k-co"></dt><dd id="c-co"></dd></div>
        <div><dt id="k-vis"></dt><dd id="c-v"></dd></div>
      </dl>
      <p class="fact" id="c-fact"></p>
      <p class="verdict" id="c-now"></p>
    </article>

    <section class="tonight">
      <h3 id="tonightTitle"></h3>
      <p class="sub" id="tonightSub"></p>
      <ol id="tonightList"></ol>
    </section>
  </aside>
</div>

<section class="cat">
  <h2 id="catTitle"></h2>
  <p id="catNote"></p>
  <div class="grid" id="cat"></div>
</section>

<footer id="footer"></footer>
</div>

<script>
"use strict";
const R = 460, CX = 500, CY = 500;
const KM = R / 1737;              /* px per km */
const D2R = Math.PI / 180;

/* ---------- projection: orthographic, north up, east (IAU) right ---------- */
function proj(lat, lon){
  const la = lat * D2R, lo = lon * D2R;
  const x = CX + R * Math.cos(la) * Math.sin(lo);
  const y = CY - R * Math.sin(la);
  const d = Math.hypot(x - CX, y - CY);
  const f = Math.sqrt(Math.max(0, 1 - (d / R) ** 2));   /* foreshortening */
  const ang = Math.atan2(y - CY, x - CX) * 180 / Math.PI;
  return {x, y, f, ang, d};
}

/* ---------- interface strings ----------
   Every user-visible string lives here, keyed by language. Object names and
   facts sit with the data below (fields `ru` / `en`).                        */
const I18N = {
  ru:{
    htmlLang:"ru", ogLocale:"ru_RU",
    title:"Лунный атлас",
    metaDesc:"Интерактивная карта видимой стороны Луны: 60 объектов с названиями, размерами и фактами. Тень идёт по настоящей фазе — карта показывает, что доступно вашей оптике именно сегодня.",
    ogDesc:"60 объектов с названиями, размерами и фактами. Кратеры в истинном масштабе, тень идёт по настоящей фазе — видно, что доступно сегодня.",
    twDesc:"60 объектов с названиями, размерами и фактами. Тень идёт по настоящей фазе.",
    svgAlt:"Схема видимой стороны Луны с подписями морей и кратеров",
    eyebrow:(d,m,p) => p + " \u00a0/\u00a0 " + d + " \u00a0/\u00a0 оптика " + m + "×",
    home:"Будва", coords:(la,lo) => num(Math.abs(la).toFixed(2)) + "° " + (la >= 0 ? "с.ш." : "ю.ш.") + " " + num(Math.abs(lo).toFixed(2)) + "° " + (lo >= 0 ? "в.д." : "з.д."),
    kPlace:"Место наблюдения", geoBtn:"Моё место", geoWait:"Ищем…", geoDenied:"Нет доступа",
    kAlt:"Над горизонтом", altUp:(a,az) => a + "° " + az, altDown:a => "−" + a + "° <small>под горизонтом</small>",
    kTilt:"Наклон диска", tilt:q => (q > 0 ? "+" : "") + q + "°",
    dirs:["С","СВ","В","ЮВ","Ю","ЮЗ","З","СЗ"],
    tSky:"Как в небе",
    h1:'Лунный <em>атлас</em>',
    lede:"Векторная карта видимой стороны, построенная по селенографическим координатам: кратеры нанесены в истинном масштабе и с учётом ракурса у края диска. Тень движется по настоящей фазе — тяните ползунок, чтобы увидеть любую ночь цикла. Тапайте объекты.",
    kPhase:"Фаза", kIllum:"Освещено", kTerm:"Терминатор",
    kLimit:m => "Предел " + m + "×", limit:km => "≈" + km + " км <small>детали</small>",
    kMag:"Увеличение", magHint:"крат", magTitle:"Увеличение вашей оптики",
    kScale:"Масштаб", scale:"1 px ≈ 3,8 км",
    hint:"Север сверху · восток справа (как в прямой оптике без призмы-перевёртыша)",
    kAge:"Возраст Луны", days:v => v + " сут",
    tToday:"Сегодня", tShadowOff:"Снять тень", tShadowOn:"Вернуть тень",
    tNames:"Все подписи", tBino:m => "Только для " + m + "×", tSites:"Места посадок",
    kDia:"Диаметр", kDep:"Глубина / высота", kCo:"Координаты", kVis:m => "В " + m + "× оптику",

/* ---------- lunar phase for the current moment ----------
   Truncated ELP2000/VSOP87 series (Meeus, ch. 25 and 47): ecliptic longitudes
   of Moon and Sun to better than 0.1°. The driving quantity is the elongation
   E: 0° new moon, 180° full moon. Terminator and illumination follow from it;
   "age in days" is merely a convenient unit for the slider. */
const SYN = 29.530588853;
function julianDay(d){ return d.getTime() / 86400000 + 2440587.5; }
function nrm360(x){ return ((x % 360) + 360) % 360; }
function elongation(date){
  const T = (julianDay(date) - 2451545.0) / 36525, r = D2R;
  const Ls = 280.46646 + 36000.76983*T + 0.0003032*T*T;
  const Ms = 357.52911 + 35999.05029*T - 0.0001537*T*T;
  const C  = (1.914602 - 0.004817*T)*Math.sin(Ms*r)
           + (0.019993 - 0.000101*T)*Math.sin(2*Ms*r)
           + 0.000289*Math.sin(3*Ms*r);
  const sun = nrm360(Ls + C);
  const Lm = 218.3164477 + 481267.88123421*T - 0.0015786*T*T;
  const D  = 297.8501921 + 445267.1114034*T  - 0.0018819*T*T;
  const Mm = 134.9633964 + 477198.8675055*T  + 0.0087414*T*T;
  const F  = 93.2720950  + 483202.0175233*T  - 0.0036539*T*T;
  const dL = 6.288774*Math.sin(Mm*r) + 1.274027*Math.sin((2*D-Mm)*r)
    + 0.658314*Math.sin(2*D*r)       + 0.213618*Math.sin(2*Mm*r)
    - 0.185116*Math.sin(Ms*r)        - 0.114332*Math.sin(2*F*r)
    + 0.058793*Math.sin((2*D-2*Mm)*r)+ 0.057066*Math.sin((2*D-Ms-Mm)*r)
    + 0.053322*Math.sin((2*D+Mm)*r)  + 0.045758*Math.sin((2*D-Ms)*r)
    - 0.040923*Math.sin((Ms-Mm)*r)   - 0.034720*Math.sin(D*r)
    - 0.030383*Math.sin((Ms+Mm)*r)   + 0.015327*Math.sin((2*D-2*F)*r)
    - 0.012528*Math.sin((Mm+2*F)*r)  + 0.010980*Math.sin((Mm-2*F)*r)
    + 0.010675*Math.sin((4*D-Mm)*r)  + 0.010034*Math.sin(3*Mm*r);
  return nrm360(nrm360(Lm + dL) - sun);
}
const NOW = new Date();
const TODAY_AGE = elongation(NOW) / 360 * SYN;

/* ---------- where the Moon hangs in the sky ----------
   Geocentric ecliptic longitude/latitude of the Moon (Meeus ch. 47, truncated)
   -> equatorial RA/Dec -> local hour angle -> altitude, azimuth and the
   parallactic angle q, the tilt between celestial north and the zenith.
   Rotating the chart by -q shows the disc as it actually stands over you.   */
function moonEcliptic(date){
  const T = (julianDay(date) - 2451545.0) / 36525, r = D2R;
  const Lm = 218.3164477 + 481267.88123421*T - 0.0015786*T*T;
  const D  = 297.8501921 + 445267.1114034*T  - 0.0018819*T*T;
  const Ms = 357.52911 + 35999.05029*T - 0.0001537*T*T;
  const Mm = 134.9633964 + 477198.8675055*T  + 0.0087414*T*T;
  const F  = 93.2720950  + 483202.0175233*T  - 0.0036539*T*T;
  const dL = 6.288774*Math.sin(Mm*r) + 1.274027*Math.sin((2*D-Mm)*r)
    + 0.658314*Math.sin(2*D*r)       + 0.213618*Math.sin(2*Mm*r)
    - 0.185116*Math.sin(Ms*r)        - 0.114332*Math.sin(2*F*r)
    + 0.058793*Math.sin((2*D-2*Mm)*r)+ 0.057066*Math.sin((2*D-Ms-Mm)*r)
    + 0.053322*Math.sin((2*D+Mm)*r)  + 0.045758*Math.sin((2*D-Ms)*r)
    - 0.040923*Math.sin((Ms-Mm)*r)   - 0.034720*Math.sin(D*r);
  const B = 5.128122*Math.sin(F*r)        + 0.280602*Math.sin((Mm+F)*r)
    + 0.277693*Math.sin((Mm-F)*r)         + 0.173237*Math.sin((2*D-F)*r)
    + 0.055413*Math.sin((2*D-Mm+F)*r)     + 0.046271*Math.sin((2*D-Mm-F)*r)
    + 0.032573*Math.sin((2*D+F)*r)        + 0.017198*Math.sin((2*Mm+F)*r)
    + 0.009266*Math.sin((2*D+Mm-F)*r)     + 0.008822*Math.sin((2*Mm-F)*r)
    + 0.008216*Math.sin((2*D-Ms-F)*r)     + 0.004324*Math.sin((2*D-2*Mm-F)*r);
  return {lam:nrm360(Lm + dL), bet:B, T};
}
function moonEquatorial(date){
  const {lam, bet, T} = moonEcliptic(date), r = D2R;
  const eps = (23.439291 - 0.0130042*T) * r;
  const l = lam * r, b = bet * r;
  const ra = Math.atan2(Math.sin(l)*Math.cos(eps) - Math.tan(b)*Math.sin(eps), Math.cos(l));
  const dec = Math.asin(Math.sin(b)*Math.cos(eps) + Math.cos(b)*Math.sin(eps)*Math.sin(l));
  return {ra:nrm360(ra / r), dec:dec / r};
}
function gmstDeg(date){
  const jd = julianDay(date), T = (jd - 2451545.0) / 36525;
  return nrm360(280.46061837 + 360.98564736629*(jd - 2451545.0)
    + 0.000387933*T*T - T*T*T/38710000);
}
function skyView(date, lat, lon){
  const r = D2R;
  const {ra, dec} = moonEquatorial(date);
  const H = nrm360(gmstDeg(date) + lon - ra) * r;   /* local hour angle */
  const phi = lat * r, d = dec * r;
  const alt = Math.asin(Math.sin(phi)*Math.sin(d) + Math.cos(phi)*Math.cos(d)*Math.cos(H));
  const az = nrm360(Math.atan2(Math.sin(H), Math.cos(H)*Math.sin(phi) - Math.tan(d)*Math.cos(phi)) / r + 180);
  const q = Math.atan2(Math.sin(H), Math.tan(phi)*Math.cos(d) - Math.sin(d)*Math.cos(H));
  return {alt:alt / r, az, q:q / r};
}

/* ---------- language ---------- */
const LANGS = ["ru","en"];
const LS_KEY = "moon-atlas-lang";
const LS_MAG = "moon-atlas-mag";
const LS_GEO = "moon-atlas-geo";
const HOME = {lat:42.29, lon:18.84, named:false};
function pickLang(){
  const q = new URLSearchParams(location.search).get("lang");
  if(LANGS.includes(q)) return q;
  let saved = null;
  try{ saved = localStorage.getItem(LS_KEY); }catch(e){}
  if(LANGS.includes(saved)) return saved;
  return (navigator.language || "en").toLowerCase().startsWith("ru") ? "ru" : "en";
}

function pickMag(){
  const q = parseFloat(new URLSearchParams(location.search).get("mag"));
  if(q >= 2 && q <= 400) return Math.round(q);
  let saved = NaN;
  try{ saved = parseFloat(localStorage.getItem(LS_MAG)); }catch(e){}
  return (saved >= 2 && saved <= 400) ? Math.round(saved) : 10;
}

function pickGeo(){
  try{
    const g = JSON.parse(localStorage.getItem(LS_GEO) || "null");
    if(g && isFinite(g.lat) && isFinite(g.lon)) return {lat:g.lat, lon:g.lon, named:true};
  }catch(e){}
  return {...HOME};
}

/* ---------- state ---------- */
const S = {age:TODAY_AGE, shadow:true, allNames:false, binoOnly:false, sites:false,
           sel:null, lang:pickLang(), mag:pickMag(), geo:pickGeo(), sky:false};

/* the slider walks the synodic cycle; the sky is computed for the moment it lands on */
const skyDate = () => new Date(NOW.getTime() + (S.age - TODAY_AGE) * 86400000);
const sky = () => skyView(skyDate(), S.geo.lat, S.geo.lon);
const T = () => I18N[S.lang];
const $ = id => document.getElementById(id);
const SVGNS = "http://www.w3.org/2000/svg";
function el(tag, attrs){
  const e = document.createElementNS(SVGNS, tag);
  for(const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}

/* ---------- optics ----------
   Each feature carries v: 1 = easy at 10×, 2 = at the limit of 10×, 3 = telescope.
   That translates into a required magnification; everything the reader sees about
   visibility is derived from it and from the magnification they entered.        */
const REQ = {1:10, 2:15, 3:30};
const MIN = {1:6, 2:9, 3:18};
const detailKm = () => Math.max(1, Math.round(200 / S.mag));
const reachable = o => S.mag >= MIN[o.v];
function visLabel(o){
  const L = T();
  if(S.mag >= REQ[o.v]) return L.vis[1];
  if(S.mag >= MIN[o.v]) return L.vis[2];
  return L.visNo(MIN[o.v]);
}

/* ---------- localised formatting & naming ---------- */
const num = n => S.lang === "ru" ? String(n).replace(".", ",") : String(n);
const dkm = d => S.lang === "ru"
  ? (d >= 1000 ? num((Math.round(d/10)/100).toFixed(2)) + " тыс. км" : num(d) + " км")
  : (d >= 1000 ? d.toLocaleString("en-US") + " km" : d + " km");
const dkmShort = d => S.lang === "ru" ? dkm(d).replace(" тыс. км", " тыс.") : dkm(d);
/* display name: Russian equivalent in RU, Latin name in EN */
const name = o => S.lang === "ru" ? (o.ru && o.ru !== "—" ? o.ru : o.n) : o.n;
const fact = o => (o.f && o.f[S.lang]) || "";
const dateline = () => S.lang === "ru"
  ? NOW.getDate() + " " + MONTHS.ru[NOW.getMonth()] + " " + NOW.getFullYear()
  : MONTHS.en[NOW.getMonth()] + " " + NOW.getDate() + ", " + NOW.getFullYear();

/* ---------- static layers ---------- */
function drawGrid(){
  const g = $("gridL");
  for(let lon=-60; lon<=60; lon+=30){
    let d = "";
    for(let lat=-90; lat<=90; lat+=3){
      const p = proj(lat, lon);
      d += (lat===-90 ? "M " : "L ") + p.x.toFixed(1) + " " + p.y.toFixed(1) + " ";
    }
    g.appendChild(el("path",{d, fill:"none", stroke:"#8A7A55", "stroke-width":.8, opacity:.22}));
  }
  for(let lat=-60; lat<=60; lat+=30){
    let d = "";
    for(let lon=-90; lon<=90; lon+=3){
      const p = proj(lat, lon);
      d += (lon===-90 ? "M " : "L ") + p.x.toFixed(1) + " " + p.y.toFixed(1) + " ";
    }
    g.appendChild(el("path",{d, fill:"none", stroke:"#8A7A55", "stroke-width":.8, opacity:.22}));
  }
}

function drawMaria(){
  const g = $("maria"), L = $("labels"), H = $("hits");
  MARIA.forEach((m, i) => {
    const grp = el("g", {opacity:".92"});
    const shapes = m.parts
      ? m.parts.map(p => ({cx:p[0], cy:p[1], rx:p[2], ry:p[3], rot:p[4]}))
      : [{cx:m.cx, cy:m.cy, rx:m.rx, ry:m.ry, rot:m.rot}];
    shapes.forEach(s => {
      grp.appendChild(el("ellipse",{
        cx:0, cy:0, rx:s.rx, ry:s.ry, fill:"#5A6479",
        transform:`translate(${s.cx},${s.cy}) rotate(${s.rot})`
      }));
    });
    grp.setAttribute("data-t","mare"); grp.setAttribute("data-i", i);
    g.appendChild(grp);

    const t = el("text",{x:m.cx, y:m.cy + m.fs*0.34, class:"m-label", "font-size":m.fs});
    t.textContent = m.short ||
      m.n.replace("Mare ","M. ").replace("Oceanus ","O. ").replace("Sinus ","S. ");
    L.appendChild(t);

    const hit = el("ellipse",{cx:m.cx, cy:m.cy, rx:(m.rx||100), ry:(m.ry||180), class:"hit"});
    hit.addEventListener("click", () => select("mare", i));
    H.appendChild(hit);
  });
}

function drawCraters(){
  const g = $("craters"), L = $("labels"), H = $("hits");
  CRATERS.forEach((c, i) => {
    const p = proj(c.lat, c.lon);
    const r = Math.max(1.6, c.dia * KM / 2);
    const grp = el("g",{"data-crater":i});
    grp.appendChild(el("ellipse",{cx:0, cy:0, rx:Math.max(.8, r*p.f), ry:r,
      fill:"rgba(116,104,74,.20)", stroke:"#6C6248", "stroke-width":Math.min(2.0, .85 + r*.045),
      transform:`translate(${p.x.toFixed(1)},${p.y.toFixed(1)}) rotate(${p.ang.toFixed(1)})`}));
    if(r > 9) grp.appendChild(el("circle",{cx:p.x, cy:p.y, r:Math.max(1.4, r*.11),
      fill:"#5C5440", opacity:.8}));
    g.appendChild(grp);

    if(!c.skipLabel){
      const out = 1 + (r + 13) / Math.max(1, p.d);
      const lx = CX + (p.x - CX) * out, ly = CY + (p.y - CY) * out;
      const t = el("text",{x:lx.toFixed(1), y:(ly + 4).toFixed(1),
        "font-size":c.key ? 15 : 12.5, "data-lbl-crater":i,
        class:"c-label" + (c.key ? " key" : "")});
      t.textContent = c.n;
      L.appendChild(t);
    }

    const hit = el("circle",{cx:p.x, cy:p.y, r:Math.max(20, r + 6), class:"hit"});
    hit.addEventListener("click", () => select("crater", i));
    H.appendChild(hit);
  });
}

/* rotate the whole disc by the parallactic angle: zenith up instead of north up */
function applySky(){
  const q = S.sky ? sky().q : 0;
  $("sky").setAttribute("transform", `rotate(${(-q).toFixed(2)},${CX},${CY})`);
}

/* ---------- terminator ---------- */
function termLongitude(age){
  /* selenographic longitude of the sunrise/sunset line, east positive */
  let t = 90 - (age / 29.53) * 360;      /* sunrise line: +90 at new, 0 at Q1, -90 at full */
  if(age > 29.53 / 2) t += 180;           /* past full the visible line is the sunset one */
  return t;
}
function normLon(l){ let x = ((l + 180) % 360 + 360) % 360 - 180; return x; }

function drawShadow(){
  const g = $("shadow"), b = $("termband");
  g.textContent = ""; b.textContent = "";
  if(!S.shadow) return;
  const phi = 2 * Math.PI * S.age / 29.53;
  const rx = Math.max(.05, R * Math.abs(Math.cos(phi)));
  const shadowLeft = phi < Math.PI;                     /* waxing: lit on the right */
  const bulgeRight = shadowLeft ? (phi < Math.PI/2) : (phi < 3*Math.PI/2);
  const d = `M ${CX} ${CY-R} A ${R} ${R} 0 0 ${shadowLeft?0:1} ${CX} ${CY+R}` +
            ` A ${rx.toFixed(2)} ${R} 0 0 ${bulgeRight?0:1} ${CX} ${CY-R} Z`;
  g.appendChild(el("path",{d, fill:"#05070B", opacity:.87}));
  /* warm glow along the terminator.
     note: this path runs T->B, the reverse of arc2 above, so the sweep flag mirrors */
  const t = `M ${CX} ${CY-R} A ${rx.toFixed(2)} ${R} 0 0 ${bulgeRight?1:0} ${CX} ${CY+R}`;
  b.appendChild(el("path",{d:t, fill:"none", stroke:"#DDA24A", "stroke-width":10,
    opacity:.16, filter:"url(#soft)"}));
  b.appendChild(el("path",{d:t, fill:"none", stroke:"#DDA24A", "stroke-width":1.4, opacity:.55}));
}

/* which features sit near the terminator (and are lit) */
function tonightPicks(){
  const tl = normLon(termLongitude(S.age));
  const all = [
    ...MARIA.map((m,i) => ({...m, t:"mare", i})),
    ...CRATERS.map((c,i) => ({...c, t:"crater", i})),
    ...RANGES.map((r,i) => ({...r, t:"range", i}))
  ];
  return all
    .filter(o => reachable(o) && !o.skipLabel && isLit(o.lon))
    .map(o => ({o, dl:Math.abs(normLon(o.lon - tl))}))
    .filter(x => x.dl < 18)
    .sort((a,b) => a.dl - b.dl)
    .slice(0, 7)
    .map(x => x.o);
}

/* ---------- rendering that depends on state ---------- */
function applyVisibility(){
  document.querySelectorAll("[data-crater]").forEach(n => {
    const c = CRATERS[+n.dataset.crater];
    n.style.display = (S.binoOnly && !reachable(c)) ? "none" : "";
  });
  document.querySelectorAll("[data-lbl-crater]").forEach(n => {
    const i = +n.getAttribute("data-lbl-crater"), c = CRATERS[i];
    const hideByBino = S.binoOnly && !reachable(c);
    const show = !hideByBino && (S.allNames || c.key || S.sel === "crater:" + i);
    n.style.display = show ? "" : "none";
    n.style.fill = S.sel === "crater:" + i ? "#8A4B0A" : "";
    n.style.fontWeight = S.sel === "crater:" + i ? "700" : "";
  });
  document.querySelectorAll("[data-lbl-range]").forEach(n => {
    const i = +n.getAttribute("data-lbl-range"), m = RANGES[i];
    const hideByBino = S.binoOnly && !reachable(m);
    const show = !hideByBino && (S.allNames || m.key || S.sel === "range:" + i);
    n.style.display = show ? "" : "none";
    n.style.fill = S.sel === "range:" + i ? "#8A4B0A" : "";
    n.style.fontWeight = S.sel === "range:" + i ? "700" : "";
  });
  document.querySelectorAll("[data-range]").forEach(n => {
    const m = RANGES[+n.dataset.range];
    n.style.display = (S.binoOnly && !reachable(m)) ? "none" : "";
  });
  $("sites").style.display = S.sites ? "" : "none";
  /* selection ring */
  const old = $("selRing"); if(old) old.remove();
  if(S.sel){
    const [t, i] = S.sel.split(":");
    let p = null, r = 26;
    if(t === "crater"){ const c = CRATERS[+i]; p = proj(c.lat, c.lon); r = Math.max(20, c.dia*KM/2 + 10); }
    if(t === "mare"){ const m = MARIA[+i]; p = {x:m.cx, y:m.cy}; r = Math.max(m.rx||90, m.ry||120) + 12; }
    if(t === "range"){ const m = RANGES[+i]; p = {x:m.lx, y:m.ly}; r = 24; }
    if(p){
      const c = el("circle",{id:"selRing", cx:p.x, cy:p.y, r, fill:"none",
        stroke:"#7FA79A", "stroke-width":1.6, "stroke-dasharray":"4 5", opacity:.9});
      $("labels").appendChild(c);
    }
  }
}

function renderReadout(){
  const age = S.age, t = T();
  const illum = Math.round((1 - Math.cos(2*Math.PI*age/29.53)) / 2 * 100);
  const P = t.phases;
  let nm;
  if(age < 1 || age > 28.6) nm = P[0];
  else if(age < 6.4) nm = P[1];
  else if(age < 8.4) nm = P[2];
  else if(age < 13.8) nm = P[3];
  else if(age < 15.8) nm = P[4];
  else if(age < 21.1) nm = P[5];
  else if(age < 23.1) nm = P[6];
  else nm = P[7];
  $("r-phase").textContent = nm;
  $("r-illum").textContent = illum + "%";
  const tl = normLon(termLongitude(age));
  $("r-term").textContent = Math.abs(Math.round(tl)) + "° " + (tl >= 0 ? t.termE : t.termW);
  $("ageOut").textContent = t.days(num(age.toFixed(1)));
  const v = sky();
  $("r-alt").innerHTML = v.alt >= 0
    ? t.altUp(Math.round(v.alt), t.dirs[Math.round(nrm360(v.az) / 45) % 8])
    : t.altDown(Math.round(-v.alt));
  $("r-tilt").textContent = t.tilt(Math.round(v.q));
}

function renderTonight(){
  const list = $("tonightList"), t = T();
  list.textContent = "";
  const picks = tonightPicks();
  if(!picks.length){
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = S.mag < 6 ? t.emptyMag(S.mag)
      : (S.age < 1.2 || S.age > 28.4) ? t.emptyNew : t.emptyNone;
    list.appendChild(p);
    return;
  }
  picks.forEach(o => {
    const li = document.createElement("li");
    const b = document.createElement("button");
    b.className = "nm"; b.textContent = name(o);
    b.addEventListener("click", () => select(o.t, o.i));
    const s = document.createElement("span");
    s.className = "dim"; s.textContent = dkm(o.dia);
    li.append(b, s); list.appendChild(li);
  });
}

function isLit(lon){
  const tl = normLon(termLongitude(S.age));
  if(!S.shadow) return true;
  const waxing = S.age < 29.53/2;
  const d = normLon(lon - tl);
  return waxing ? d > 0 : d < 0;
}

function select(t, i){
  S.sel = t + ":" + i;
  const L = T();
  const o = t === "mare" ? MARIA[i] : t === "crater" ? CRATERS[i] : RANGES[i];
  $("c-kind").textContent = t === "mare" ? L.kindMare
    : t === "crater" ? L.kindCrater : L.kindRange;
  $("c-name").textContent = o.n;
  $("c-ru").textContent = o.ru && o.ru !== "—" ? o.ru : L.dash;
  $("c-d").textContent = dkm(o.dia);
  $("c-h").textContent = o.dep ? L.deep(num(o.dep)) : o.h ? L.high(num(o.h)) : L.dash;
  $("c-co").textContent = num(Math.abs(o.lat).toFixed(1)) + "° " + (o.lat >= 0 ? L.latN : L.latS) +
    " · " + num(Math.abs(o.lon).toFixed(1)) + "° " + (o.lon >= 0 ? L.lonE : L.lonW);
  $("c-v").textContent = visLabel(o);
  $("c-fact").textContent = fact(o);
  const tl = normLon(termLongitude(S.age));
  const dl = Math.abs(normLon(o.lon - tl));
  let verdict;
  if(!S.shadow) verdict = L.vShadowOff;
  else if(!isLit(o.lon)) verdict = L.vDark(Math.max(1, Math.round(dl / 12.2)));
  else if(dl < 10) verdict = L.vTerm;
  else if(dl < 25) verdict = L.vGood;
  else verdict = L.vFlat;
  $("c-now").textContent = verdict;
  applyVisibility();
}

function buildCatalogue(){
  const wrap = $("cat"), L = T();
  wrap.textContent = "";
  const total = MARIA.length + CRATERS.length + RANGES.length;
  $("catTitle").textContent = L.catTitle(total);
  $("catNote").textContent = L.catNote;
  const groups = [
    [L.groups[0], MARIA.map((m,i)=>({o:m,t:"mare",i}))],
    [L.groups[1], CRATERS.map((c,i)=>({o:c,t:"crater",i})).filter(x=>x.o.dia>=90)],
    [L.groups[2], CRATERS.map((c,i)=>({o:c,t:"crater",i})).filter(x=>x.o.dia<90 && !x.o.skipLabel)],
    [L.groups[3], RANGES.map((m,i)=>({o:m,t:"range",i}))]
  ];
  groups.forEach(([title, items]) => {
    const col = document.createElement("div"); col.className = "col";
    const h = document.createElement("h3"); h.textContent = title; col.appendChild(h);
    const ul = document.createElement("ul");
    items.sort((a,b) => b.o.dia - a.o.dia).forEach(({o,t,i}) => {
      const li = document.createElement("li");
      const b = document.createElement("button");
      const nm = document.createElement("span");
      nm.textContent = name(o);
      const n = document.createElement("span");
      n.className = "n";
      n.textContent = dkmShort(o.dia);
      b.append(nm, n);
      b.addEventListener("click", () => {
        select(t, i);
        const box = document.querySelector(".stage").getBoundingClientRect();
        window.scrollTo({top: box.top + window.scrollY - 20, behavior:"smooth"});
      });
      li.appendChild(b); ul.appendChild(li);
    });
    col.appendChild(ul); wrap.appendChild(col);
  });
}

/* ---------- chart: everything language-dependent inside the SVG ---------- */
function paintChart(){
  ["gridL","maria","rays","ranges","craters","sites","shadow","termband","labels","hits","frame","scale"]
    .forEach(id => { $(id).textContent = ""; });
  drawGrid(); drawMaria(); drawRays(); drawRanges(); drawCraters(); drawSites(); drawFrame();
  drawShadow(); applySky();
}

function setLang(lang){
  if(lang === S.lang || !LANGS.includes(lang)) return;
  S.lang = lang;
  try{ localStorage.setItem(LS_KEY, lang); }catch(e){}
  const url = new URL(location.href);
  url.searchParams.set("lang", lang);
  history.replaceState(null, "", url);
  renderChrome(); paintChart(); renderReadout(); renderTonight(); buildCatalogue();
  const [t, i] = (S.sel || "crater:1").split(":");
  select(t, +i);
}

/* ---------- wiring ---------- */
function toggle(id, key){
  const b = $(id);
  b.addEventListener("click", () => {
    S[key] = !S[key];
    b.setAttribute("aria-pressed", String(S[key]));
    applyVisibility();
  });
}

renderReadout(); renderTonight(); buildCatalogue();
select("crater", CRATERS.findIndex(c => c.n === "Copernicus"));

$("langs").addEventListener("click", e => {
  const b = e.target.closest("button[data-lang]");
  if(b) setLang(b.dataset.lang);
});

function commitMag(v, echo){
  const n = Math.round(v);
  const clamped = Number.isFinite(n) ? Math.min(400, Math.max(2, n)) : S.mag;
  if(echo) $("mag").value = String(clamped);
  if(clamped === S.mag) return;
  S.mag = clamped;
  try{ localStorage.setItem(LS_MAG, String(S.mag)); }catch(err){}
  renderChrome(); renderTonight(); applyVisibility();
  if(S.sel){ const [t,i] = S.sel.split(":"); select(t, +i); }
}
/* live update only while the typed value is already usable; change/blur clamps
   and echoes back, so the field never shows a magnification the page isn't using */
$("mag").addEventListener("input", e => {
  const v = parseFloat(e.target.value);
  if(v >= 2 && v <= 400) commitMag(v, false);
});
["change","blur"].forEach(ev =>
  $("mag").addEventListener(ev, e => commitMag(parseFloat(e.target.value), true)));

$("geo").addEventListener("click", () => {
  const b = $("geo");
  if(!navigator.geolocation){ b.textContent = T().geoDenied; return; }
  b.textContent = T().geoWait; b.disabled = true;
  navigator.geolocation.getCurrentPosition(pos => {
    b.disabled = false;
    S.geo = {lat:pos.coords.latitude, lon:pos.coords.longitude, named:true};
    try{ localStorage.setItem(LS_GEO, JSON.stringify({lat:S.geo.lat, lon:S.geo.lon})); }catch(e){}
    S.sky = true; $("t-sky").setAttribute("aria-pressed","true");
    renderChrome(); renderReadout(); applySky();
  }, () => {
    b.disabled = false; b.textContent = T().geoDenied;
    setTimeout(() => { b.textContent = T().geoBtn; }, 2600);
  }, {timeout:10000, maximumAge:600000});
});

$("t-sky").addEventListener("click", () => {
  S.sky = !S.sky;
  $("t-sky").setAttribute("aria-pressed", String(S.sky));
  applySky();
});

$("age").addEventListener("input", e => {
  S.age = parseFloat(e.target.value);
  if(!S.shadow){ S.shadow = true; $("t-full").setAttribute("aria-pressed","false");
    $("t-full").textContent = T().tShadowOff; }
  $("t-today").setAttribute("aria-pressed", String(Math.abs(S.age - TODAY_AGE) < .06));
  renderReadout(); drawShadow(); renderTonight();
  if(S.sel){ const [t,i] = S.sel.split(":"); select(t, +i); }
});

$("age").addEventListener("change", () => applySky());

$("t-today").addEventListener("click", () => {
  S.age = TODAY_AGE; S.shadow = true;
  $("age").value = String(TODAY_AGE); $("t-today").setAttribute("aria-pressed","true");
  $("t-full").setAttribute("aria-pressed","false"); $("t-full").textContent = T().tShadowOff;
  renderReadout(); drawShadow(); renderTonight();
  if(S.sel){ const [t,i] = S.sel.split(":"); select(t, +i); }
});

$("t-full").addEventListener("click", () => {
  S.shadow = !S.shadow;
  $("t-full").setAttribute("aria-pressed", String(!S.shadow));
  $("t-full").textContent = S.shadow ? T().tShadowOff : T().tShadowOn;
  $("t-today").setAttribute("aria-pressed", String(S.shadow && Math.abs(S.age - TODAY_AGE) < .06));
  drawShadow(); renderTonight();
  if(S.sel){ const [t,i] = S.sel.split(":"); select(t, +i); }
});

toggle("t-names", "allNames");
toggle("t-bino", "binoOnly");
toggle("t-sites", "sites");
applyVisibility();
</script>
</body>
</html>
